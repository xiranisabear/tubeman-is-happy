<script>
const app = document.getElementById('app');
const names = ['Berry Pop','Clover Soda','Cookie Cloud','Lilac Picnic'];
const faces = ['(˶ᵔ ᵕ ᵔ˶)','(ﾉ◕ヮ◕)ﾉ','(ᵔᴥᵔ)','(✿◠‿◠)'];
const asset = name => 'assets/' + name + '.png';
const pose = index => asset('pose-' + String(index).padStart(2,'0'));
let selected = null;
let shot = 0;
let cameraStream;
let cameraRequest = 0;
let capturedPhotos = [];

function stopCamera() {
  cameraRequest++;
  cameraStream?.getTracks().forEach(track => track.stop());
  cameraStream = undefined;
}

if (typeof window !== 'undefined') window.addEventListener('pagehide', stopCamera);

function cameraPreview(frame) {
  return `<div class="photo preview"><video id="camera-preview" autoplay muted playsinline aria-label="Live camera preview"></video><img src="${asset('frame-0' + (frame + 1))}" alt=""></div>`;
}

function attachCamera() {
  const video = document.getElementById('camera-preview');
  video.srcObject = cameraStream;
  return video;
}

function takePhoto(video) {
  if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) throw new Error('Camera frame unavailable');
  const side = Math.min(video.videoWidth, video.videoHeight);
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 1000;
  const context = canvas.getContext('2d');
  context.translate(1000, 0);
  context.scale(-1, 1);
  context.drawImage(video, (video.videoWidth - side) / 2, (video.videoHeight - side) / 2, side, side, 0, 0, 1000, 1000);
  return canvas.toDataURL('image/jpeg', 0.88);
}
let countdownTimer;
let roomMusic;
let audioContext;

function enableCountdownAudio() {
  if (typeof AudioContext === 'undefined') return;
  try {
    audioContext ??= new AudioContext();
    audioContext.resume().catch(() => {});
  } catch {}
}

function printerSound() {
  if (audioContext?.state !== 'running') return;
  const duration = 3.4;
  const rate = audioContext.sampleRate;
  const buffer = audioContext.createBuffer(1, Math.round(rate * duration), rate);
  const samples = buffer.getChannelData(0);
  for (let i = 0; i < samples.length; i++) {
    const time = i / rate;
    const envelope = Math.min(1, time / 0.08, (duration - time) / 0.24);
    const pulse = 0.4 + 0.6 * Math.pow(Math.sin(Math.PI * 7 * time), 4);
    const motor = Math.sin(2 * Math.PI * 145 * time + 1.3 * Math.sin(2 * Math.PI * 7 * time));
    samples[i] = envelope * pulse * (0.025 * motor + 0.038 * (Math.random() * 2 - 1));
  }
  const source = audioContext.createBufferSource();
  source.buffer = buffer;
  source.connect(audioContext.destination);
  source.start();
}

function shutterSnap() {
  if (audioContext?.state !== 'running') return;
  const rate = audioContext.sampleRate;
  const buffer = audioContext.createBuffer(1, Math.round(rate * 0.085), rate);
  const samples = buffer.getChannelData(0);
  for (let i = 0; i < samples.length; i++) {
    const t = i / rate;
    const firstClick = Math.exp(-t * 180);
    const secondClick = t >= 0.028 ? 0.5 * Math.exp(-(t - 0.028) * 210) : 0;
    samples[i] = (Math.random() * 2 - 1) * (firstClick + secondClick) * 0.32;
  }
  const shutter = audioContext.createBufferSource();
  shutter.buffer = buffer;
  shutter.connect(audioContext.destination);
  shutter.start();
}

function countdownChime(seconds) {
  if (audioContext?.state !== 'running') return;
  const now = audioContext.currentTime;
  const tone = audioContext.createOscillator();
  const volume = audioContext.createGain();
  tone.frequency.value = seconds === 1 ? 880 : 660;
  volume.gain.setValueAtTime(0.001, now);
  volume.gain.exponentialRampToValueAtTime(0.085, now + 0.012);
  volume.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
  tone.connect(volume).connect(audioContext.destination);
  tone.start(now);
  tone.stop(now + 0.17);
}

function photo(frame, extra = '', source = asset('empty-preview')) {
  return `<div class="photo ${extra}"><img src="${source}" alt="Framed photo"><img src="${asset('frame-0' + (frame + 1))}" alt=""></div>`;
}

function screen(title, body) {
  clearTimeout(countdownTimer);
  roomMusic?.pause();
  document.body.classList.remove('room');
  document.body.classList.remove('frame-picker');
  app.innerHTML = `<h1 tabindex="-1">${title}</h1>${body}`;
  app.querySelector('h1').focus();
}

function bind(id, handler) {
  document.getElementById(id).onclick = handler;
}

function entrance(playMusic = true) {
  document.body.classList.add('room');
  app.innerHTML = `<button class="secondary music-toggle" id="music" aria-pressed="false" aria-label="Entrance music" title="Play music"><span class="clef" aria-hidden="true">𝄞<i>✦</i><b>✧</b></span></button>
  <button class="primary enter-invite" id="enter-invite">Enter the booth</button>
  <button class="booth" id="enter" aria-label="Tubeman Is Happy! Enter the booth">
    <span class="sign"><span class="ticker"><span class="line">Tubeman Is Happy!</span></span><span class="character" aria-hidden="true"></span></span>
    <span class="panel-art" aria-hidden="true"><span class="stitch top"></span><span class="stitch bottom"></span><span class="slot"></span></span>
    <span class="door" aria-hidden="true"><span class="seat"></span><span class="curtain"></span></span>
  </button>`;
  const musicButton = document.getElementById('music');
  if (typeof Audio !== 'undefined') {
    roomMusic ??= new Audio('assets/booth-music-original.wav');
    roomMusic.loop = true;
    roomMusic.volume = 0.32;
    const syncMusic = () => {
      musicButton.title = roomMusic.paused ? 'Play music' : 'Pause music';
      musicButton.setAttribute('aria-pressed', String(!roomMusic.paused));
    };
    bind('music', async () => {
      if (roomMusic.paused) await roomMusic.play().catch(() => {});
      else roomMusic.pause();
      syncMusic();
    });
    if (playMusic) roomMusic.play().then(syncMusic, syncMusic);
  }
  bind('enter', frames);
  bind('enter-invite', frames);
  app.focus({preventScroll:true});
}

function frames() {
  screen('Choose your frame', `<div class="grid" aria-label="Frame choices">${names.map((name,index) =>
    `<button class="choice" aria-pressed="${index === selected}" data-index="${index}">${photo(index)}<span>${name} <bdi aria-hidden="true">${faces[index]}</bdi></span></button>`).join('')}</div>
    <button id="back" class="secondary">Back</button><button id="continue" class="primary" ${selected === null ? 'disabled' : ''}>Continue</button>`);
  document.body.classList.add('frame-picker');
  for (const button of app.querySelectorAll('.choice')) {
    button.onclick = () => {
      selected = Number(button.dataset.index);
      for (const choice of app.querySelectorAll('.choice')) {
        choice.setAttribute('aria-pressed', String(choice === button));
      }
      document.getElementById('continue').disabled = false;
    };
  }
  bind('back', () => entrance());
  bind('continue', () => setup());
}

function setup(message = '') {
  stopCamera();
  capturedPhotos = [];
  screen('Get ready to dance', `<ol class="dance-steps" aria-label="How the photo booth works">
      <li><strong>3 seconds</strong><span>Get ready</span></li>
      <li><strong>18 poses</strong><span>Copy Tubeman</span></li>
      <li><strong>Every 2 seconds</strong><span>The booth snaps a photo</span></li>
    </ol><div id="setup-preview">${photo(selected,'preview')}</div>
    <p id="camera-status" role="status"></p>
    <button id="back" class="secondary">Back</button><button id="camera" class="primary">Enable camera</button><button id="dance" class="primary" hidden>Start Dancing</button>`);
  const status = document.getElementById('camera-status');
  status.textContent = message;
  bind('back', () => { stopCamera(); frames(); });
  bind('dance', () => {
    shot = 0;
    enableCountdownAudio();
    capture(true);
  });
  bind('camera', async () => {
    if (!navigator.mediaDevices?.getUserMedia) {
      setup('Camera access needs a supported browser on localhost or HTTPS.');
      return;
    }
    const request = ++cameraRequest;
    const button = document.getElementById('camera');
    button.disabled = true;
    status.textContent = 'Waiting for camera permission…';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({video: {width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
      if (request !== cameraRequest) {
        stream.getTracks().forEach(track => track.stop());
        return;
      }
      cameraStream = stream;
      for (const track of stream.getVideoTracks()) {
        track.addEventListener('ended', () => {
          if (cameraStream === stream) setup('The camera disconnected. Enable it to start a new session.');
        }, {once: true});
      }
      document.getElementById('setup-preview').innerHTML = cameraPreview(selected);
      await attachCamera().play();
      if (request !== cameraRequest) return;
      status.textContent = 'Camera ready. Keep your face and hands in frame.';
      button.hidden = true;
      document.getElementById('dance').hidden = false;
    } catch (error) {
      if (request !== cameraRequest) return;
      const messages = {
        NotAllowedError: 'Camera access was denied. Allow access in your browser and try again.',
        NotFoundError: 'No camera was found. Connect one and try again.'
      };
      setup(messages[error.name] || 'Could not start the camera. Check that it is available and try again.');
    }
  });
}

function capture(live = false) {
  screen('Follow Tubeman and pose', `<div class="capture">${live ? cameraPreview(selected) : photo(selected,'preview')}
    <div class="guide">
      <p id="pose-label">Get ready</p>
      <img id="pose-guide" src="${pose(1)}" alt="Tubeman pose 1">
      <p class="pose-timer" role="status"><span id="timer-label">Starting in</span><strong id="countdown"></strong></p>
      <button id="pause" class="primary">Pause</button>
      <button id="cancel" class="secondary">${live ? 'Cancel session' : 'Cancel demo'}</button>
    </div></div>
    <div class="capture-history"><span id="capture-count">0 of 18 captured</span>
      <progress id="capture-progress" aria-label="Photos captured" value="0" max="18"></progress>
      <div class="history" aria-hidden="true">${Array.from({length:18}, (_, index) =>
        `<span id="shot-${index}"></span>`).join('')}</div>
    </div>`);
  bind('cancel', () => setup());
  const video = live ? attachCamera() : null;
  video?.play().catch(() => {
    if (video.srcObject === cameraStream) setup('Could not continue the camera preview. Please try again.');
  });
  const countdown = document.getElementById('countdown');
  const label = document.getElementById('pose-label');
  const guide = document.getElementById('pose-guide');
  const preview = app.querySelector('.photo');
  preview.addEventListener('animationend', () => preview.classList.remove('flash'));

  const pause = document.getElementById('pause');
  const timerLabel = document.getElementById('timer-label');
  let pendingTick;
  let timeLeft;
  let deadline;
  let activeMessage;
  let paused = false;

  function scheduleTick() {
    deadline = performance.now() + timeLeft;
    countdownTimer = setTimeout(pendingTick, timeLeft);
  }

  bind('pause', () => {
    paused = !paused;
    pause.textContent = paused ? 'Resume' : 'Pause';
    timerLabel.textContent = paused ? 'Paused' : activeMessage;
    if (paused) {
      clearTimeout(countdownTimer);
      timeLeft = Math.max(0, deadline - performance.now());
    } else {
      scheduleTick();
    }
  });

  function countDown(seconds, message, done) {
    activeMessage = message;
    timerLabel.textContent = message;
    countdown.textContent = `${seconds} s`;
    countdownChime(seconds);
    timeLeft = 1000;
    pendingTick = () => {
      if (seconds === 1) done();
      else countDown(seconds - 1, message, done);
    };
    scheduleTick();
  }

  function nextPose() {
    label.textContent = `Pose ${shot + 1} / 18`;
    guide.src = pose(shot + 1);
    guide.alt = `Tubeman pose ${shot + 1}`;
    countDown(2, 'Next shot in', () => {
      let source = asset('empty-preview');
      if (live) {
        try {
          source = takePhoto(video);
          capturedPhotos.push(source);
        } catch {
          setup('The camera stopped supplying photos. Enable it and start a new session.');
          return;
        }
      }
      document.getElementById('shot-' + shot).innerHTML = `<img src="${source}" alt="">`;
      shot++;
      document.getElementById('capture-progress').value = shot;
      document.getElementById('capture-count').textContent = `${shot} of 18 captured`;
      shutterSnap();
      preview.classList.add('flash');
      if (shot === 18) {
        if (live) {
          video.insertAdjacentHTML('beforebegin', `<img src="${capturedPhotos.at(-1)}" alt="Final captured photo">`);
          video.remove();
          stopCamera();
        }
        pause.disabled = true;
        document.getElementById('timer-label').textContent = 'All shots captured';
        app.querySelector('.pose-timer').classList.add('is-complete');
        countdown.textContent = '';
        countdownTimer = setTimeout(printKeepsake, 2000);
      } else {
        nextPose();
      }
    });
  }

  countDown(3, 'Starting in', nextPose);
}

function printKeepsake() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    reveal();
    return;
  }
  entrance(false);
  const booth = document.getElementById('enter');
  document.getElementById('enter-invite').hidden = true;
  document.getElementById('music').hidden = true;
  booth.classList.add('printing');
  booth.disabled = true;
  booth.setAttribute('aria-label', 'Photo booth');
  booth.querySelector('.panel-art').insertAdjacentHTML(
    'beforeend', `<span class="print-window">${photo(selected, '', capturedPhotos.at(-1)).replace("<div", "<span").replace("</div>", "</span>")}</span>`
  );
  app.insertAdjacentHTML('afterbegin', '<p class="print-status" role="status">Printing your photo…</p>');
  const print = booth.querySelector('.print-window .photo');

  print.addEventListener('animationstart', printerSound, {once: true});
  print.addEventListener('animationend', () => {
    const start = print.getBoundingClientRect();
    reveal();
    const preview = app.querySelector('.preview');
    const end = preview.getBoundingClientRect();
    preview.animate([
      {transformOrigin: 'top left', transform: `translate(${start.left - end.left}px, ${start.top - end.top}px) scale(${start.width / end.width})`},
      {transformOrigin: 'top left', transform: 'none'}
    ], {duration: 900, easing: 'cubic-bezier(.2,.72,.24,1)'});
  }, {once: true});
}

let gifUrl;
let videoUrl;

function releaseGif() {
  if (gifUrl) URL.revokeObjectURL(gifUrl);
  gifUrl = undefined;
}

if (typeof window !== 'undefined') {
  window.addEventListener('pagehide', event => {
    if (!event.persisted) {
      releaseGif();
      releaseVideo();
    }
  });
}

function loadGifImage(source) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = reject;
    image.src = source;
  });
}

async function renderGif(photos, frame, status, preview, download, retry) {
  const size = 480;
  retry.hidden = true;
  status.textContent = 'Preparing your GIF…';
  try {
    // Inline image data keeps canvas pixel access available when opened from disk.
    const overlay = await loadGifImage(gifOverlays[frame]);
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = size;
    const context = canvas.getContext('2d', {willReadFrequently: true});
    const encoder = createGifEncoder(size);

    for (let i = 0; i < photos.length; i++) {
      const image = await loadGifImage(photos[i]);
      if (!preview.isConnected) return;
      context.drawImage(image, 0, 0, size, size);
      context.drawImage(overlay, 0, 0, size, size);
      encoder.addFrame(context.getImageData(0, 0, size, size).data);
      status.textContent = `Making your GIF · ${i + 1} / ${photos.length}`;
      await new Promise(resolve => requestAnimationFrame(resolve));
    }

    if (!preview.isConnected) return;
    releaseGif();
    gifUrl = URL.createObjectURL(encoder.finish());
    const animation = await loadGifImage(gifUrl);
    if (!preview.isConnected) return;
    animation.alt = 'Your looping Tubeman animation';
    preview.replaceChildren(animation);
    download.href = gifUrl;
    download.hidden = false;
    status.textContent = 'Your GIF is ready.';
  } catch {
    if (!preview.isConnected) return;
    releaseGif();
    status.textContent = 'Could not create your GIF. You can retry with these photos.';
    retry.hidden = false;
  }
}

function releaseVideo() {
  if (videoUrl) URL.revokeObjectURL(videoUrl);
  videoUrl = undefined;
}

async function prepareVideo(photos, frame, button, link, status) {
  button.disabled = true;
  status.textContent = 'Preparing your video…';
  let stream;
  let recorder;
  try {
    const canvas = document.createElement('canvas');
    if (typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
      throw new Error('Video export is unavailable in this browser.');
    }
    const mimeType = ['video/mp4', 'video/webm;codecs=vp8', 'video/webm']
      .find(type => MediaRecorder.isTypeSupported(type));
    if (!mimeType) throw new Error('Video export is unavailable in this browser.');

    const [overlay, ...images] = await Promise.all([
      loadGifImage(gifOverlays[frame]), ...photos.map(loadGifImage)
    ]);
    if (!button.isConnected) return;
    const size = 480;
    canvas.width = canvas.height = size;
    const context = canvas.getContext('2d');
    stream = canvas.captureStream(30);
    recorder = new MediaRecorder(stream, {mimeType});
    const chunks = [];
    const finished = new Promise((resolve, reject) => {
      recorder.ondataavailable = event => {
        if (event.data.size) chunks.push(event.data);
      };
      recorder.onstop = () => resolve(new Blob(chunks, {type: recorder.mimeType || mimeType}));
      recorder.onerror = () => reject(new Error('The browser could not record the video.'));
    });
    function draw(image) {
      context.drawImage(image, 0, 0, size, size);
      context.drawImage(overlay, 0, 0, size, size);
    }
    draw(images[0]);
    recorder.start();
    const recordFrames = async () => {
      for (const image of images) {
        if (!button.isConnected || recorder.state !== 'recording') break;
        draw(image);
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      if (recorder.state !== 'inactive') recorder.stop();
    };
    const [video] = await Promise.all([finished, recordFrames()]);
    if (!button.isConnected) return;
    if (!video.size) throw new Error('The browser produced an empty video.');
    releaseVideo();
    videoUrl = URL.createObjectURL(video);
    link.href = videoUrl;
    link.download = 'tubeman-is-happy.' + (video.type.startsWith('video/mp4') ? 'mp4' : 'webm');
    link.hidden = false;
    button.hidden = true;
    status.textContent = 'Your video is ready.';
    link.click();
  } catch (error) {
    if (button.isConnected) status.textContent = error.message || 'Could not create your video. Try again.';
  } finally {
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    stream?.getTracks().forEach(track => track.stop());
    button.disabled = false;
  }
}

function reveal() {
  const live = capturedPhotos.length === 18;
  screen('Here’s a little happiness!', `<p>${live ? 'Captured with' : 'Sample result with'} the ${names[selected]} frame.</p>${photo(selected,'preview',capturedPhotos.at(-1))}
    ${live ? '<p id="gif-status" role="status"></p><a id="download-gif" class="primary gif-download" download="tubeman-is-happy.gif" hidden>Download GIF</a><button id="retry-gif" class="secondary" hidden>Retry GIF</button><button id="make-video" class="primary">Download Video</button><a id="save-video" class="primary gif-download" hidden>Save Video</a><p id="video-status" role="status"></p>' : ''}
    <button id="again" class="primary">Try Again</button>`);
  bind('again', () => {
    releaseGif();
    releaseVideo();
    selected = null;
    shot = 0;
    capturedPhotos = [];
    frames();
  });
  if (live) {
    const generate = () => renderGif(capturedPhotos, selected, document.getElementById('gif-status'),
      app.querySelector('.preview'), document.getElementById('download-gif'), document.getElementById('retry-gif'));
    bind('retry-gif', generate);
    bind('make-video', () => prepareVideo(capturedPhotos, selected, document.getElementById('make-video'),
      document.getElementById('save-video'), document.getElementById('video-status')));
    generate();
  }
}

entrance();
</script>
</html>
